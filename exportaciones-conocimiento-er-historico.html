<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serie histórica — exportaciones de conocimiento, Entre Ríos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  .viz-root {
    color-scheme: light;
    --surface:  #ffffff;
    --ink:      #1d1d1f;
    --muted:    #86868b;
    --hair:     #e6e6e8;
    --hair2:    #f0f0f2;
    --accent:       #0071e3;
    --accent-soft:  #cfe4fb;
    --record-dot:   #d0342c;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface:  #1c1c1e;
      --ink:      #f5f5f7;
      --muted:    #98989d;
      --hair:     #38383a;
      --hair2:    #2c2c2e;
      --accent:       #0a84ff;
      --accent-soft:  rgba(10,132,255,0.18);
      --record-dot:   #ff453a;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface:  #1c1c1e;
    --ink:      #f5f5f7;
    --muted:    #98989d;
    --hair:     #38383a;
    --hair2:    #2c2c2e;
    --accent:       #0a84ff;
    --accent-soft:  rgba(10,132,255,0.18);
    --record-dot:   #ff453a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .viz-root {
    max-width: 620px;
    margin: 0 auto;
    padding: 4px 0 8px;
  }
  .viz-title { font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; color: var(--ink); margin: 0 0 6px; }
  .viz-sub { font-size: 12.5px; color: var(--muted); margin: 0 0 16px; font-weight: 500; letter-spacing: -.005em; }

  .chart-wrap { position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .gridline { stroke: var(--hair2); stroke-width: 1; }
  .axis-label { fill: var(--muted); font-size: 10.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .line-path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .area-path { fill: var(--accent-soft); opacity: .45; stroke: none; }
  .record-dot { fill: var(--record-dot); stroke: var(--surface); stroke-width: 2; }
  .record-label { fill: var(--ink); font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .crosshair { stroke: var(--hair); stroke-width: 1; opacity: 0; pointer-events: none; }
  .hover-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; opacity: 0; pointer-events: none; }
  .hit-area { fill: transparent; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: var(--surface);
    font-size: 12px;
    padding: 7px 10px;
    border-radius: 8px;
    white-space: nowrap;
    opacity: 0;
    transform: translate(-50%, -112%);
    transition: opacity .1s ease;
    z-index: 5;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
    font-weight: 500;
  }
  .tooltip.show { opacity: 1; }
  .tooltip strong { font-weight: 700; font-variant-numeric: tabular-nums; }

  .viz-footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hair); }
  .viz-source { font-size: 11px; color: var(--muted); font-weight: 500; }
  .viz-source a { color: var(--muted); }
</style>
</head>
<body>

<div class="viz-root">
  <p class="viz-title">Las exportaciones de economía del conocimiento crecen en Entre Ríos, pero están por debajo del máximo histórico</p>
  <p class="viz-sub">Millones de dólares, valor trimestral · 2007 — 2026</p>

  <div class="chart-wrap">
    <svg id="svg" viewBox="0 0 600 220" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <div class="viz-footer">
    <span class="viz-source">Fuente: <a href="https://app.powerbi.com/view?r=eyJrIjoiMDRmMTIxZDMtODI5Ny00ZGYyLWE1ZWMtOTRlMTBlMDNjYjZhIiwidCI6ImNiODg0ZGI1LTI0ODUtNGY5Yi05MzhlLTNlNjIxZjIyMjU3YiIsImMiOjR9" target="_blank" rel="noopener">Ministerio de Economía de la Nación</a></span>
  </div>
</div>

<script>
const DATA = [{"periodo": "2007-Q1", "v": 2.859}, {"periodo": "2007-Q2", "v": 3.224}, {"periodo": "2007-Q3", "v": 3.565}, {"periodo": "2007-Q4", "v": 4.277}, {"periodo": "2008-Q1", "v": 3.836}, {"periodo": "2008-Q2", "v": 4.586}, {"periodo": "2008-Q3", "v": 4.757}, {"periodo": "2008-Q4", "v": 5.102}, {"periodo": "2009-Q1", "v": 4.155}, {"periodo": "2009-Q2", "v": 4.587}, {"periodo": "2009-Q3", "v": 4.732}, {"periodo": "2009-Q4", "v": 5.543}, {"periodo": "2010-Q1", "v": 5.201}, {"periodo": "2010-Q2", "v": 7.028}, {"periodo": "2010-Q3", "v": 5.782}, {"periodo": "2010-Q4", "v": 7.41}, {"periodo": "2011-Q1", "v": 7.626}, {"periodo": "2011-Q2", "v": 7.96}, {"periodo": "2011-Q3", "v": 7.956}, {"periodo": "2011-Q4", "v": 11.646}, {"periodo": "2012-Q1", "v": 8.311}, {"periodo": "2012-Q2", "v": 8.348}, {"periodo": "2012-Q3", "v": 8.114}, {"periodo": "2012-Q4", "v": 8.784}, {"periodo": "2013-Q1", "v": 7.271}, {"periodo": "2013-Q2", "v": 8.295}, {"periodo": "2013-Q3", "v": 8.382}, {"periodo": "2013-Q4", "v": 10.145}, {"periodo": "2014-Q1", "v": 6.788}, {"periodo": "2014-Q2", "v": 7.511}, {"periodo": "2014-Q3", "v": 7.642}, {"periodo": "2014-Q4", "v": 9.328}, {"periodo": "2015-Q1", "v": 6.657}, {"periodo": "2015-Q2", "v": 8.095}, {"periodo": "2015-Q3", "v": 8.063}, {"periodo": "2015-Q4", "v": 8.408}, {"periodo": "2016-Q1", "v": 7.66}, {"periodo": "2016-Q2", "v": 8.279}, {"periodo": "2016-Q3", "v": 9.237}, {"periodo": "2016-Q4", "v": 13.016}, {"periodo": "2017-Q1", "v": 9.953}, {"periodo": "2017-Q2", "v": 11.794}, {"periodo": "2017-Q3", "v": 11.84}, {"periodo": "2017-Q4", "v": 14.964}, {"periodo": "2018-Q1", "v": 10.914}, {"periodo": "2018-Q2", "v": 10.493}, {"periodo": "2018-Q3", "v": 8.738}, {"periodo": "2018-Q4", "v": 10.288}, {"periodo": "2019-Q1", "v": 8.333}, {"periodo": "2019-Q2", "v": 8.937}, {"periodo": "2019-Q3", "v": 9.078}, {"periodo": "2019-Q4", "v": 9.529}, {"periodo": "2020-Q1", "v": 8.361}, {"periodo": "2020-Q2", "v": 6.873}, {"periodo": "2020-Q3", "v": 6.823}, {"periodo": "2020-Q4", "v": 8.623}, {"periodo": "2021-Q1", "v": 8.147}, {"periodo": "2021-Q2", "v": 9.102}, {"periodo": "2021-Q3", "v": 9.126}, {"periodo": "2021-Q4", "v": 10.49}, {"periodo": "2022-Q1", "v": 10.038}, {"periodo": "2022-Q2", "v": 9.781}, {"periodo": "2022-Q3", "v": 10.262}, {"periodo": "2022-Q4", "v": 11.722}, {"periodo": "2023-Q1", "v": 10.406}, {"periodo": "2023-Q2", "v": 11.109}, {"periodo": "2023-Q3", "v": 10.636}, {"periodo": "2023-Q4", "v": 11.747}, {"periodo": "2024-Q1", "v": 9.501}, {"periodo": "2024-Q2", "v": 11.172}, {"periodo": "2024-Q3", "v": 13.207}, {"periodo": "2024-Q4", "v": 13.635}, {"periodo": "2025-Q1", "v": 13.187}, {"periodo": "2025-Q2", "v": 14.148}, {"periodo": "2025-Q3", "v": 13.828}, {"periodo": "2025-Q4", "v": 13.981}, {"periodo": "2026-Q1", "v": 14.415}];

(function () {
  const svg = document.getElementById('svg');
  const tooltip = document.getElementById('tooltip');
  const W = 600, H = 220;
  const padL = 34, padR = 10, padT = 10, padB = 20;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const values = DATA.map(d => d.v);
  const maxV = Math.max(...values);
  const minV = 0;

  function x(i) { return padL + (i / (DATA.length - 1)) * plotW; }
  function y(v) { return padT + plotH - ((v - minV) / (maxV - minV)) * plotH; }

  const ns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs) {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  const steps = 4;
  for (let s = 0; s <= steps; s++) {
    const v = (maxV / steps) * s;
    const gy = y(v);
    svg.appendChild(el('line', { class: 'gridline', x1: padL, x2: W - padR, y1: gy, y2: gy }));
    const t = el('text', { class: 'axis-label', x: 4, y: gy + 3 });
    t.textContent = Math.round(v).toLocaleString('es-AR');
    svg.appendChild(t);
  }

  DATA.forEach((d, i) => {
    const m = d.periodo.match(/^(\d{4})-Q1$/);
    if (m && Number(m[1]) % 2 === 1) {
      const t = el('text', { class: 'axis-label', x: x(i), y: H - 4, 'text-anchor': 'middle' });
      t.textContent = m[1];
      svg.appendChild(t);
    }
  });

  let areaD = `M ${x(0)} ${y(0)} `;
  DATA.forEach((d, i) => { areaD += `L ${x(i)} ${y(d.v)} `; });
  areaD += `L ${x(DATA.length - 1)} ${y(0)} Z`;
  svg.appendChild(el('path', { class: 'area-path', d: areaD }));

  let lineD = '';
  DATA.forEach((d, i) => { lineD += (i === 0 ? 'M' : 'L') + ` ${x(i)} ${y(d.v)} `; });
  svg.appendChild(el('path', { class: 'line-path', d: lineD }));

  // punto mas alto real de la serie trimestral (no asumir que es el ultimo)
  let maxIdx = 0;
  DATA.forEach((d, i) => { if (d.v > DATA[maxIdx].v) maxIdx = i; });
  const maxDot = el('circle', { class: 'record-dot', cx: x(maxIdx), cy: y(DATA[maxIdx].v), r: 4 });
  svg.appendChild(maxDot);
  const maxLabel = el('text', {
    class: 'record-label',
    x: x(maxIdx),
    y: y(DATA[maxIdx].v) - 10,
    'text-anchor': maxIdx > DATA.length - 8 ? 'end' : 'middle'
  });
  maxLabel.textContent = `US$ ${DATA[maxIdx].v.toFixed(1)}M`;
  svg.appendChild(maxLabel);

  const lastIdx = DATA.length - 1;
  if (lastIdx !== maxIdx) {
    const lastDot = el('circle', { cx: x(lastIdx), cy: y(DATA[lastIdx].v), r: 3, fill: 'var(--accent)', stroke: 'var(--surface)', 'stroke-width': 2 });
    svg.appendChild(lastDot);
    const lastLabel = el('text', { class: 'axis-label', x: x(lastIdx) - 4, y: y(DATA[lastIdx].v) - 8, 'text-anchor': 'end' });
    lastLabel.setAttribute('fill', 'var(--ink)');
    lastLabel.style.fontWeight = '700';
    lastLabel.textContent = `US$ ${DATA[lastIdx].v.toFixed(1)}M`;
    svg.appendChild(lastLabel);
  }

  const crosshair = el('line', { class: 'crosshair', x1: 0, x2: 0, y1: padT, y2: H - padB });
  svg.appendChild(crosshair);
  const hoverDot = el('circle', { class: 'hover-dot', r: 4 });
  svg.appendChild(hoverDot);

  const hit = el('rect', { class: 'hit-area', x: padL, y: padT, width: plotW, height: plotH });
  svg.appendChild(hit);

  function nearestIndex(px) {
    const rel = (px - padL) / plotW;
    let i = Math.round(rel * (DATA.length - 1));
    return Math.max(0, Math.min(DATA.length - 1, i));
  }

  function showAt(i) {
    const d = DATA[i];
    crosshair.setAttribute('x1', x(i));
    crosshair.setAttribute('x2', x(i));
    crosshair.setAttribute('opacity', '1');
    hoverDot.setAttribute('cx', x(i));
    hoverDot.setAttribute('cy', y(d.v));
    hoverDot.setAttribute('opacity', '1');
    tooltip.innerHTML = '';
    const strong = document.createElement('strong');
    strong.textContent = `US$ ${d.v.toFixed(1)}M`;
    tooltip.appendChild(strong);
    tooltip.appendChild(document.createElement('br'));
    const span = document.createElement('span');
    span.textContent = d.periodo.replace('-Q', ' — T');
    tooltip.appendChild(span);
    const rect = svg.getBoundingClientRect();
    const scale = rect.width / W;
    tooltip.style.left = (x(i) * scale) + 'px';
    tooltip.style.top = (y(d.v) * scale) + 'px';
    tooltip.classList.add('show');
  }
  function hide() {
    crosshair.setAttribute('opacity', '0');
    hoverDot.setAttribute('opacity', '0');
    tooltip.classList.remove('show');
  }

  hit.addEventListener('pointermove', (e) => {
    const rect = svg.getBoundingClientRect();
    const scale = W / rect.width;
    const px = (e.clientX - rect.left) * scale;
    showAt(nearestIndex(px));
  });
  hit.addEventListener('pointerleave', hide);
})();
</script>

</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Región centro — exportaciones de conocimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  .viz-root {
    color-scheme: light;
    --page:     #f5f5f7;
    --surface:  #ffffff;
    --ink:      #1d1d1f;
    --muted:    #86868b;
    --hair:     #e6e6e8;
    --hair2:    #f0f0f2;
    --bar-prev: #cfe4fb;
    --bar-curr: #0071e3;
    --gain:     #1f6f5c;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --page:     #000000;
      --surface:  #1c1c1e;
      --ink:      #f5f5f7;
      --muted:    #98989d;
      --hair:     #38383a;
      --hair2:    #2c2c2e;
      --bar-prev: #2c4a68;
      --bar-curr: #0a84ff;
      --gain:     #32d74b;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --page:     #000000;
    --surface:  #1c1c1e;
    --ink:      #f5f5f7;
    --muted:    #98989d;
    --hair:     #38383a;
    --hair2:    #2c2c2e;
    --bar-prev: #2c4a68;
    --bar-curr: #0a84ff;
    --gain:     #32d74b;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--page); }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .viz-root {
    background: var(--surface);
    border: 1px solid var(--hair);
    border-radius: 16px;
    padding: 22px 24px 18px;
    max-width: 620px;
    margin: 0 auto;
    letter-spacing: -.005em;
  }
  .viz-kicker { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .viz-title { font-size: 19px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); margin: 0 0 2px; }
  .viz-sub { font-size: 12.5px; color: var(--muted); margin: 0 0 18px; font-weight: 500; }

  .panels { display: flex; gap: 20px; }
  .panel { flex: 1; min-width: 0; }
  .panel-title { font-size: 13px; font-weight: 700; color: var(--ink); margin: 0 0 2px; text-align: center; letter-spacing: -.01em; }
  .panel-delta { font-size: 12px; font-weight: 700; color: var(--gain); text-align: center; margin: 0 0 10px; font-variant-numeric: tabular-nums; }

  .bars { display: flex; align-items: flex-end; justify-content: center; gap: 16px; height: 120px; position: relative; }
  .bar-col { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
  .bar-cap { font-size: 11.5px; font-weight: 700; color: var(--ink); margin-bottom: 5px; font-variant-numeric: tabular-nums; }
  .bar { width: 24px; border-radius: 5px 5px 0 0; cursor: pointer; outline-offset: 2px; }
  .bar.prev { background: var(--bar-prev); }
  .bar.curr { background: var(--bar-curr); }
  .bar:hover, .bar:focus-visible { filter: brightness(1.06); }
  .baseline { position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid var(--hair); }
  .panel-axis { display: flex; justify-content: center; gap: 16px; margin-top: 7px; }
  .panel-axis span { width: 24px; font-size: 10px; color: var(--muted); text-align: center; font-weight: 500; }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--ink);
    color: var(--surface);
    font-size: 12px;
    padding: 7px 10px;
    border-radius: 8px;
    white-space: nowrap;
    opacity: 0;
    transform: translate(-50%, -112%);
    transition: opacity .1s ease;
    z-index: 5;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
    font-weight: 500;
  }
  .tooltip.show { opacity: 1; }
  .tooltip strong { font-weight: 700; font-variant-numeric: tabular-nums; }

  .viz-footer { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--hair); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .viz-source { font-size: 11px; color: var(--muted); font-weight: 500; }
  .viz-source a { color: var(--muted); }
  .table-toggle { font: inherit; font-size: 11.5px; font-weight: 600; color: var(--bar-curr); background: none; border: none; cursor: pointer; padding: 4px 0; }
  .table-toggle:hover { opacity: .65; }

  table.viz-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; display: none; }
  table.viz-table.show { display: table; }
  table.viz-table th, table.viz-table td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--hair2); color: var(--ink); }
  table.viz-table th { color: var(--muted); font-weight: 600; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; }
  table.viz-table td { font-weight: 500; }
  table.viz-table td:last-child, table.viz-table th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="viz-root">
  <p class="viz-kicker">Economía del conocimiento</p>
  <p class="viz-title">La región centro exportó más</p>
  <p class="viz-sub">1er trimestre de cada año, en millones de dólares</p>

  <div class="panels" id="panels"></div>
  <div class="tooltip" id="tooltip"></div>

  <table class="viz-table" id="table">
    <thead><tr><th>Provincia</th><th>1T 2025</th><th>1T 2026</th><th>Var.</th></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div class="viz-footer">
    <span class="viz-source">Fuente: <a href="https://app.powerbi.com/view?r=eyJrIjoiMDRmMTIxZDMtODI5Ny00ZGYyLWE1ZWMtOTRlMTBlMDNjYjZhIiwidCI6ImNiODg0ZGI1LTI0ODUtNGY5Yi05MzhlLTNlNjIxZjIyMjU3YiIsImMiOjR9" target="_blank" rel="noopener">Ministerio de Economía de la Nación</a></span>
    <button class="table-toggle" id="toggleTable" type="button">Ver tabla</button>
  </div>
</div>

<script>
const DATA = [
  { nombre: "Entre Ríos", v25: 13.187, v26: 14.415 },
  { nombre: "Córdoba", v25: 178.746, v26: 200.429 },
  { nombre: "Santa Fe", v25: 117.244, v26: 139.039 }
];

(function () {
  const panels = document.getElementById('panels');
  const tooltip = document.getElementById('tooltip');
  const tbody = document.getElementById('tableBody');

  DATA.forEach(d => {
    const delta = ((d.v26 / d.v25 - 1) * 100);
    const maxV = Math.max(d.v25, d.v26);
    const hPrev = Math.round((d.v25 / maxV) * 96) + 4;
    const hCurr = Math.round((d.v26 / maxV) * 96) + 4;

    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML = `
      <p class="panel-title">${d.nombre}</p>
      <p class="panel-delta">+${delta.toFixed(1)}%</p>
      <div class="bars">
        <div class="baseline"></div>
        <div class="bar-col">
          <div class="bar-cap">${d.v25.toFixed(1)}</div>
          <div class="bar prev" tabindex="0" data-label="${d.nombre} · 1T 2025" data-value="US$ ${d.v25.toFixed(1)}M" style="height:${hPrev}px;"></div>
        </div>
        <div class="bar-col">
          <div class="bar-cap">${d.v26.toFixed(1)}</div>
          <div class="bar curr" tabindex="0" data-label="${d.nombre} · 1T 2026" data-value="US$ ${d.v26.toFixed(1)}M" style="height:${hCurr}px;"></div>
        </div>
      </div>
      <div class="panel-axis"><span>1T25</span><span>1T26</span></div>
    `;
    panels.appendChild(panel);

    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${d.nombre}</td><td>${d.v25.toFixed(1)}</td><td>${d.v26.toFixed(1)}</td><td>+${delta.toFixed(1)}%</td>`;
    tbody.appendChild(tr);
  });

  document.querySelectorAll('.bar').forEach(bar => {
    function show() {
      const label = bar.getAttribute('data-label');
      const value = bar.getAttribute('data-value');
      tooltip.innerHTML = '';
      const strong = document.createElement('strong');
      strong.textContent = value;
      tooltip.appendChild(strong);
      tooltip.appendChild(document.createElement('br'));
      const span = document.createElement('span');
      span.textContent = label;
      tooltip.appendChild(span);
      const rect = bar.getBoundingClientRect();
      tooltip.style.left = (rect.left + rect.width / 2) + 'px';
      tooltip.style.top = rect.top + 'px';
      tooltip.classList.add('show');
    }
    function hide() { tooltip.classList.remove('show'); }
    bar.addEventListener('pointerenter', show);
    bar.addEventListener('pointermove', show);
    bar.addEventListener('pointerleave', hide);
    bar.addEventListener('focus', show);
    bar.addEventListener('blur', hide);
  });

  const toggleBtn = document.getElementById('toggleTable');
  const table = document.getElementById('table');
  toggleBtn.addEventListener('click', () => {
    const showing = table.classList.toggle('show');
    toggleBtn.textContent = showing ? 'Ocultar tabla' : 'Ver tabla';
  });
})();
</script>

</body>
</html>
